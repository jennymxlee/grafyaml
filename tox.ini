[tox]
envlist = py310,py311,py312,py313,py313-black

[testenv]
deps =
    coverage>=3.6
    python-subunit>=0.0.18
    requests-mock>=0.6.0
    oslotest>=1.2.0
    testrepository>=0.0.18
    testscenarios>=0.4
    testtools>=0.9.36,!=1.2.0

commands = coverage run -m unittest discover {posargs}

[testenv:py313-black]
package = skip
deps = black
commands = black --check --diff .
